<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window Events</title>
    <style>
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button class="button" onclick="openWindow()">Open New Window</button>
    <button class="button" onclick="closeWindow()">Close Current Window</button>

    <script>
        function openWindow() {
            window.open("https://www.google.com");
        }
        function closeWindow() {
            window.close("https://www.google.com");
        }
        function moveWindow() {
            window.moveTo(100, 100);
        }
    </script>
</body>
</html>
