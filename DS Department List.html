<!DOCTYPE html>
<head>
    <title>DS Department List</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #5ed19a;
            align-items: center;
        }
        h2 {
            align-items: center;
            text-align: center;
            color: #000000cd;
            background-color: #e9e4e4;
            width: 400px;
        }

        label {
            font-weight: bold;
        }


        form{
            text-align: center;
            background-color: #e9e4e4;
            width: 400px;
            align-items: center;
        }

        .container {
            justify-content: center;
            align-items: center;
            background-color: #053b21;
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
        <h2><b><u>DS DEPARTMENT LIST</u></b></h2><br><br>
        <form>
        <label>Student Name:</label><br>
        <input type="text" name="Name"><br><br>

    <label>Admission Number:</label><br>
    <input type="text" name="Admission"><br><br>

    <label>University Roll Number:</label><br>
    <input type="text" name="University"><br><br>

    <label>Section:</label><br>
    <select name="Section">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
    </select><br><br>

    <input type="submit" value="Add Student">
    </form>
</body>
</html>
