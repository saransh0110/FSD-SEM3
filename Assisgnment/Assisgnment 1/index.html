<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Quiz</title>

    <link rel="stylesheet" href="index_style.css">
</head>

<body>

    <div class="container">

        <div class="quiz-box">

            <h1>Quiz Form</h1>

            <form id="studentForm">

                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
                <br><br>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <br><br>

                <label for="roll">Roll Number</label>
                <input type="text" id="roll" name="roll" placeholder="Enter your roll number" required>
                <br><br>

                <label>Section</label>

                <div class="section-options">

                    <label class="section-label">
                        <input type="radio" name="section" value="A" required>
                        CSE-DS-A
                    </label>

                    <label class="section-label">
                        <input type="radio" name="section" value="B">
                        CSE-DS-B
                    </label>

                    <label class="section-label">
                        <input type="radio" name="section" value="C">
                        CSE-DS-C
                    </label>

                </div>

                <button type="submit" id="startQuiz">
                    Start Quiz
                </button>

            </form>

        </div>

    </div>

    <script src="QuizForm.js"></script>

</body>

</html>
