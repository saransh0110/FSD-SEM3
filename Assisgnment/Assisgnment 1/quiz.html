<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Quiz</title>

    <link rel="stylesheet" href="quiz_style.css">
</head>

<body>

    <div class="quiz-container">

        <div class="quiz-header">

            <h1>Quiz Form</h1>

            <p id="studentName"></p>

            <!-- Timer -->

            <div id="timer">
                Time Left: 01:00
            </div>

        </div>


        <form id="quizForm">

            <!-- ========================= -->
            <!-- QUESTION 1 -->
            <!-- ========================= -->

            <div class="question-box" id="question1Box">

                <h3>
                    Question 1: What does HTML stand for?
                </h3>


                <div class="option">

                    <input
                        type="radio"
                        id="q1a"
                        name="question1"
                        value="A"
                    >

                    <label for="q1a">
                        A. Hyper Text Markup Language
                    </label>

                </div>


                <div class="option">

                    <input
                        type="radio"
                        id="q1b"
                        name="question1"
                        value="B"
                    >

                    <label for="q1b">
                        B. High Text Machine Language
                    </label>

                </div>


                <div class="option">

                    <input
                        type="radio"
                        id="q1c"
                        name="question1"
                        value="C"
                    >

                    <label for="q1c">
                        C. Hyperlink Text Management Language
                    </label>

                </div>


                <div class="option">

                    <input
                        type="radio"
                        id="q1d"
                        name="question1"
                        value="D"
                    >

                    <label for="q1d">
                        D. Home Tool Markup Language
                    </label>

                </div>


                <!-- Next Button -->

                <button
                    type="button"
                    id="nextButton"
                >
                    Next
                </button>

            </div>

            <!-- ========================= -->
<!-- QUESTION 2 -->
<!-- ========================= -->

<div class="question-box" id="question2Box">

    <h3>
        Question 2: What does CSS stand for?
    </h3>

    <select id="question2Select">

        <option value="">
            Select an option
        </option>

        <option value="A">
            A. Computer Style Sheets
        </option>

        <option value="B">
            B. Cascading Style Sheets
        </option>

        <option value="C">
            C. Colorful Style Sheets
        </option>

        <option value="D">
            D. Creative Style Sheets
        </option>

    </select>


    <!-- Submit Button -->

    <button
        type="submit"
        id="submitbutton"
    >
        Submit
    </button>

</div>

        </form>

    </div>


    <!-- JavaScript Files -->

    <script src="question1.js"></script>
    <script src="question2.js"></script>

</body>

</html>
